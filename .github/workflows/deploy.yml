name: Deploy engine

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    if: github.repository == 'theanshsonkar/emfirge'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Syntax check
        run: python3 -m compileall -q app

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push engine image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/aws-risk-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'theanshsonkar/emfirge'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/aws-risk-agent:latest
            sudo docker rm -f emfirge-engine 2>/dev/null || true
            sudo docker ps -q --filter "publish=8000" | xargs -r sudo docker rm -f || true
            sudo docker system prune -af || true
            if [ -n "${{ secrets.APP_PRIVATE_KEY_B64 }}" ] && ! sudo grep -q "GITHUB_PRIVATE_KEY_B64" /home/ubuntu/.env; then
              echo "GITHUB_PRIVATE_KEY_B64=${{ secrets.APP_PRIVATE_KEY_B64 }}" | sudo tee -a /home/ubuntu/.env > /dev/null
            fi
            sudo docker run -d --name emfirge-engine --restart=always \
              --env-file /home/ubuntu/.env \
              -p 8000:8000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/aws-risk-agent:latest
