name: Deploy engine

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    if: github.repository == 'theanshsonkar/emfirge'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Syntax check
        run: python3 -m compileall -q app

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push engine image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/aws-risk-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'theanshsonkar/emfirge'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/aws-risk-agent:latest
            sudo docker rm -f emfirge-engine 2>/dev/null || true
            sudo docker rm -f emfirge-scanner-worker 2>/dev/null || true
            sudo docker ps -q --filter "publish=8000" | xargs -r sudo docker rm -f || true
            sudo docker system prune -af || true
            if [ -n "${{ secrets.APP_PRIVATE_KEY_B64 }}" ] && ! sudo grep -q "GITHUB_PRIVATE_KEY_B64" /home/ubuntu/.env; then
              echo "GITHUB_PRIVATE_KEY_B64=${{ secrets.APP_PRIVATE_KEY_B64 }}" | sudo tee -a /home/ubuntu/.env > /dev/null
            fi
            # Network is created AFTER prune (prune removes unused networks).
            sudo docker network create emfirge-net 2>/dev/null || true
            # Warm Checkov scanner worker: same image, Checkov venv Python, not published.
            sudo docker run -d --name emfirge-scanner-worker --restart=always \
              --memory=300m --memory-swap=300m \
              --network emfirge-net \
              -e EMFIRGE_SCANNER_WORKER_BIND=0.0.0.0:8765 \
              ${{ secrets.DOCKERHUB_USERNAME }}/aws-risk-agent:latest \
              /opt/checkov-venv/bin/python -m app.scanner_worker
            sudo docker run -d --name emfirge-engine --restart=always \
              --memory=1400m --memory-swap=1400m \
              --network emfirge-net \
              -e EMFIRGE_RUN_SCANNERS=0 \
              -e EMFIRGE_SCANNER_URL=http://emfirge-scanner-worker:8765 \
              --env-file /home/ubuntu/.env \
              -e EMFIRGE_REQUIRE_AUTH=1 \
              -p 8000:8000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/aws-risk-agent:latest
            # Non-fatal worker check (scanners are off); allow time for the Checkov import.
            ok=0
            for i in 1 2 3 4 5 6; do
              sleep 2
              if sudo docker exec emfirge-scanner-worker /opt/checkov-venv/bin/python -c "import urllib.request as u; print(u.urlopen('http://127.0.0.1:8765/health', timeout=5).read())"; then ok=1; break; fi
            done
            [ "$ok" = 1 ] || echo "scanner worker health check failed (scanners are off; not fatal)"
      - name: Post-deploy health check (/api/project must return 401)
        run: |
          url="https://emfirge.cloud/api/project"
          code="none"
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" || true)
            echo "attempt $i/12: HTTP $code"
            if [ "$code" = "401" ]; then
              echo "Health check passed: auth lock is on."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Expected HTTP 401 from $url after ~60s, last status was $code. Deploy is not healthy or auth is off."
          exit 1
