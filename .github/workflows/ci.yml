name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  mcp:
    name: MCP build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: smoke test CLI
        run: |
          node dist/index.js status || true
          node dist/index.js privacy || true

  backend:
    name: Backend tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: AST parse all modules
        run: python -c "import ast, glob; [ast.parse(open(f).read()) for f in glob.glob('app/*.py')]; print('all modules parse clean')"
      - name: run pytest
        run: python -m pytest -q --no-header --junitxml=test-results.xml
        env:
          DATABASE_URL: 'sqlite:///:memory:'
      - name: generate scorecard
        if: always() && matrix.python == '3.12'
        run: |
          python scripts/scorecard.py test-results.xml --json scorecard.json --md scorecard.md --commit ${{ github.sha }}
          cat scorecard.md >> "$GITHUB_STEP_SUMMARY"
      - name: upload scorecard
        if: always() && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: scorecard
          path: |
            backend/scorecard.json
            backend/scorecard.md
            backend/test-results.xml
